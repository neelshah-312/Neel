<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780" viewBox="0 0 390 780" fill="none">
  <defs>
    <linearGradient id="tp-bg" x1="195" y1="0" x2="195" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1f2a"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="tp-teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="tp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14b8a6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App shell -->
  <rect width="390" height="780" fill="url(#tp-bg)"/>

  <!-- Sidebar strip -->
  <rect width="52" height="780" fill="#07151c"/>
  <rect x="14" y="28" width="24" height="24" rx="6" fill="#14b8a6" opacity="0.9"/>
  <rect x="18" y="72" width="16" height="3" rx="1.5" fill="#1e3a47"/>
  <rect x="18" y="88" width="16" height="3" rx="1.5" fill="#14b8a6" opacity="0.7"/>
  <rect x="18" y="104" width="16" height="3" rx="1.5" fill="#1e3a47"/>
  <rect x="18" y="120" width="16" height="3" rx="1.5" fill="#1e3a47"/>

  <!-- Header -->
  <text x="68" y="42" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e2f4f2">ThreatPulse</text>
  <text x="68" y="60" font-family="system-ui,sans-serif" font-size="9" fill="#5f8f96">Agentic SOC · MITRE triage</text>

  <!-- Upload card -->
  <rect x="64" y="78" width="306" height="118" rx="12" fill="#0f2430" stroke="#1a3a47" stroke-width="1"/>
  <text x="80" y="104" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#9ecfd0">Upload &amp; analyze</text>
  <rect x="80" y="114" width="274" height="34" rx="8" fill="#0a1a22" stroke="#1f4a55" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="92" y="135" font-family="system-ui,sans-serif" font-size="9" fill="#5f8f96">Auth log · Network / IDS (CSV)</text>
  <rect x="80" y="156" width="88" height="24" rx="6" fill="#132a35" stroke="#1f4a55"/>
  <text x="96" y="172" font-family="system-ui,sans-serif" font-size="8" fill="#7eb8bc">Browse files</text>
  <rect x="176" y="156" width="178" height="24" rx="6" fill="url(#tp-teal)" filter="url(#tp-glow)"/>
  <text x="210" y="172" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#042f2e">EXECUTE PIPELINE</text>

  <!-- KPI row -->
  <rect x="64" y="210" width="94" height="58" rx="10" fill="#0f2430" stroke="#1a3a47"/>
  <text x="76" y="232" font-family="system-ui,sans-serif" font-size="8" fill="#5f8f96">Events</text>
  <text x="76" y="254" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#e2f4f2">1.2k</text>
  <rect x="170" y="210" width="94" height="58" rx="10" fill="#0f2430" stroke="#1a3a47"/>
  <text x="182" y="232" font-family="system-ui,sans-serif" font-size="8" fill="#5f8f96">Detections</text>
  <text x="182" y="254" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fbbf24">18</text>
  <rect x="276" y="210" width="94" height="58" rx="10" fill="#0f2430" stroke="#1a3a47"/>
  <text x="288" y="232" font-family="system-ui,sans-serif" font-size="8" fill="#5f8f96">Incidents</text>
  <text x="288" y="254" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#f87171">4</text>

  <!-- Dashboard panel -->
  <rect x="64" y="284" width="306" height="248" rx="12" fill="#0f2430" stroke="#1a3a47"/>
  <text x="80" y="310" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#9ecfd0">Severity overview</text>

  <!-- Donut chart -->
  <circle cx="195" cy="400" r="52" fill="none" stroke="#1a3a47" stroke-width="14"/>
  <circle cx="195" cy="400" r="52" fill="none" stroke="#ef4444" stroke-width="14" stroke-dasharray="60 267" stroke-dashoffset="0" transform="rotate(-90 195 400)"/>
  <circle cx="195" cy="400" r="52" fill="none" stroke="#f97316" stroke-width="14" stroke-dasharray="45 282" stroke-dashoffset="-60" transform="rotate(-90 195 400)"/>
  <circle cx="195" cy="400" r="52" fill="none" stroke="#eab308" stroke-width="14" stroke-dasharray="55 272" stroke-dashoffset="-105" transform="rotate(-90 195 400)"/>
  <circle cx="195" cy="400" r="52" fill="none" stroke="#3b82f6" stroke-width="14" stroke-dasharray="167 160" stroke-dashoffset="-160" transform="rotate(-90 195 400)"/>
  <text x="195" y="396" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#e2f4f2">4</text>
  <text x="195" y="412" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#5f8f96">open</text>

  <!-- Legend -->
  <circle cx="92" cy="478" r="4" fill="#ef4444"/><text x="102" y="481" font-family="system-ui,sans-serif" font-size="8" fill="#7eb8bc">Critical</text>
  <circle cx="162" cy="478" r="4" fill="#f97316"/><text x="172" y="481" font-family="system-ui,sans-serif" font-size="8" fill="#7eb8bc">High</text>
  <circle cx="222" cy="478" r="4" fill="#eab308"/><text x="232" y="481" font-family="system-ui,sans-serif" font-size="8" fill="#7eb8bc">Medium</text>
  <circle cx="292" cy="478" r="4" fill="#3b82f6"/><text x="302" y="481" font-family="system-ui,sans-serif" font-size="8" fill="#7eb8bc">Low</text>

  <!-- Sparkline -->
  <rect x="80" y="494" width="274" height="24" rx="6" fill="#0a1a22"/>
  <polyline points="88,510 108,506 128,508 148,500 168,502 188,496 208,498 228,492 248,494 268,488 288,490 308,484 328,486 348,480" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Incident list -->
  <rect x="64" y="548" width="306" height="148" rx="12" fill="#0f2430" stroke="#1a3a47"/>
  <text x="80" y="574" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#9ecfd0">Active incidents</text>

  <rect x="80" y="586" width="274" height="36" rx="8" fill="#0a1a22" stroke="#1f4a55"/>
  <rect x="92" y="598" width="8" height="8" rx="2" fill="#ef4444"/>
  <text x="108" y="606" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#e2f4f2">Brute force ’ C2 chain</text>
  <text x="108" y="618" font-family="ui-monospace,Menlo,monospace" font-size="7" fill="#5f8f96">T1110 · T1078 · 192.168.4.12</text>

  <rect x="80" y="630" width="274" height="36" rx="8" fill="#0a1a22" stroke="#1f4a55"/>
  <rect x="92" y="642" width="8" height="8" rx="2" fill="#f97316"/>
  <text x="108" y="650" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#e2f4f2">Suspicious outbound IDS</text>
  <text x="108" y="662" font-family="ui-monospace,Menlo,monospace" font-size="7" fill="#5f8f96">T1071 · escalate · evidence pack</text>

  <!-- Footer chip -->
  <rect x="64" y="712" width="306" height="44" rx="10" fill="#0a1a22" stroke="#14b8a6" stroke-opacity="0.35"/>
  <text x="80" y="732" font-family="system-ui,sans-serif" font-size="8" fill="#5f8f96">Evidence triage</text>
  <text x="80" y="746" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#14b8a6">Verifier-backed · defer / escalate</text>
  <rect x="286" y="724" width="68" height="20" rx="6" fill="#132a35"/>
  <text x="298" y="738" font-family="system-ui,sans-serif" font-size="8" fill="#7eb8bc">Neo4j</text>
</svg>
