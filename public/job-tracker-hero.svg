<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="720" y1="0" x2="720" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fafbfc"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <!-- subtle sidebar hint -->
  <rect width="280" height="900" fill="#f8f9fb" opacity="0.95"/>
  <text x="48" y="56" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#31333F">Job Tracker AI</text>
  <rect x="40" y="88" width="200" height="28" rx="6" fill="#fff" stroke="#e6eaf0" stroke-width="1"/>
  <text x="52" y="107" font-family="system-ui,sans-serif" font-size="11" fill="#60646c">Navigation</text>
  <!-- main -->
  <text x="316" y="88" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="#1a1d21">💼 Job Tracker AI</text>
  <text x="316" y="130" font-family="system-ui,sans-serif" font-size="17" fill="#60646c">
    Your personal job-search command center — Gmail scanning, AI extraction,
  </text>
  <text x="316" y="154" font-family="system-ui,sans-serif" font-size="17" fill="#60646c">
    follow-up reminders, and a chatbot, all backed by local SQLite.
  </text>
  <line x1="316" y1="182" x2="1396" y2="182" stroke="#e6eaf0" stroke-width="2"/>
  <!-- metrics -->
  <g filter="url(#sh)">
    <rect x="316" y="204" width="168" height="96" rx="10" fill="#fff" stroke="#e6eaf0"/>
    <text x="332" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#60646c">Total applications</text>
    <text x="332" y="274" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#1a1d21">24</text>
    <rect x="504" y="204" width="168" height="96" rx="10" fill="#fff" stroke="#e6eaf0"/>
    <text x="520" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#60646c">Interviews</text>
    <text x="520" y="274" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#1a1d21">5</text>
    <rect x="692" y="204" width="168" height="96" rx="10" fill="#fff" stroke="#e6eaf0"/>
    <text x="708" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#60646c">Offers</text>
    <text x="708" y="274" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#1a1d21">1</text>
    <rect x="880" y="204" width="168" height="96" rx="10" fill="#fff" stroke="#e6eaf0"/>
    <text x="896" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#60646c">Cold emails sent</text>
    <text x="896" y="274" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#1a1d21">12</text>
    <rect x="1068" y="204" width="168" height="96" rx="10" fill="#fff" stroke="#e6eaf0"/>
    <text x="1084" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#60646c">Follow-ups due</text>
    <text x="1084" y="258" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#ff4b4b">3</text>
    <text x="1084" y="282" font-family="system-ui,sans-serif" font-size="11" fill="#7d7d7d">3 overdue</text>
    <rect x="1256" y="204" width="152" height="96" rx="10" fill="#fff" stroke="#e6eaf0"/>
    <text x="1272" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#60646c">No resume linked</text>
    <text x="1272" y="274" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#1a1d21">2</text>
  </g>
  <line x1="316" y1="336" x2="1396" y2="336" stroke="#e6eaf0" stroke-width="2"/>
  <!-- three columns -->
  <text x="316" y="388" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#1a1d21">📊 Dashboard</text>
  <text x="316" y="414" font-family="system-ui,sans-serif" font-size="13" fill="#60646c">KPIs, charts, and filterable master table with clickable links.</text>
  <text x="316" y="458" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#1a1d21">📧 Gmail Sync</text>
  <text x="316" y="484" font-family="system-ui,sans-serif" font-size="13" fill="#60646c">Scan 90 days of inbox + sent mail; AI auto-creates application records.</text>
  <text x="620" y="388" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#1a1d21">📋 Applications</text>
  <text x="620" y="414" font-family="system-ui,sans-serif" font-size="13" fill="#60646c">Manually add, edit, or delete records. Follow-up dates auto-computed.</text>
  <text x="620" y="458" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#1a1d21">⏰ Follow-up Center</text>
  <text x="620" y="484" font-family="system-ui,sans-serif" font-size="13" fill="#60646c">Overdue alerts, mark-done buttons, and AI-drafted follow-up emails.</text>
  <text x="924" y="388" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#1a1d21">📄 Resume Library</text>
  <text x="924" y="414" font-family="system-ui,sans-serif" font-size="13" fill="#60646c">Connect a Drive folder; auto-match resumes to roles by keyword.</text>
  <text x="924" y="458" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#1a1d21">🤖 AI Chatbot</text>
  <text x="924" y="484" font-family="system-ui,sans-serif" font-size="13" fill="#60646c">Ask anything about your pipeline. Works offline + LLM-enhanced.</text>
  <!-- expander hint -->
  <rect x="316" y="528" width="1080" height="112" rx="10" fill="#fff" stroke="#e6eaf0"/>
  <text x="340" y="562" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#1a1d21">🚀 Quick start — first-time setup</text>
  <text x="340" y="594" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#31333F">pip install -r requirements.txt  •  streamlit run app.py</text>
  <text x="340" y="618" font-family="system-ui,sans-serif" font-size="12" fill="#60646c">All data stays local in data/job_tracker.db · Gmail access is read-only.</text>
</svg>
